{% extends 'base_layout.html' %}
{% block content %}
<h1>{{ product.title }}</h1>
<img src="{{ product.image.url }}" height="300" width="300" alt="{{ product.title }}">
<p>{{ product.text }}</p>
<p><strong>₹{{ product.price }}</strong> &middot; {{ product.stock }} in stock</p>
<p>{{ product.date }}</p>
{% endblock %}
